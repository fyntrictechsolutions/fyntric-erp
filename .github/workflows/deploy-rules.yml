# Publishes firestore.rules and storage.rules to Firebase whenever they change on main,
# after the rules tests pass in the emulators. It signs in to Google without any stored key
# (Workload Identity Federation): Google trusts only this repo's main branch, acting as the
# github-rules-deploy service account (Firebase Rules Admin, Firebase Viewer, Service Usage Consumer).
# See README, "Rules publish themselves".
name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - tests/firestore-rules.test.mjs
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

concurrency:
  group: deploy-rules
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: fyntric-erp
      WIF_PROVIDER: projects/90059175990/locations/global/workloadIdentityPools/github/providers/github-repo
      DEPLOY_ACCOUNT: github-rules-deploy@fyntric-erp.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Test the rules in the emulators
        run: npm run test:rules

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}

      - name: Publish Firestore rules
        run: npx firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      # Names the bucket so the CLI doesn't have to look up the "default bucket", which Google
      # reports as missing for newer *.firebasestorage.app buckets. Only this deploy uses the copy;
      # the emulators keep reading firebase.json.
      - name: Publish Storage rules
        env:
          STORAGE_BUCKET: fyntric-erp.firebasestorage.app
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("firebase.json","utf8"));c.storage=[{bucket:process.env.STORAGE_BUCKET,rules:c.storage.rules}];fs.writeFileSync("firebase.deploy.json",JSON.stringify(c))'
          npx firebase deploy --only storage --config firebase.deploy.json --project "$FIREBASE_PROJECT" --non-interactive
